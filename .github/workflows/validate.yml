name: validate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py prolog_star_kb/*.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prolog projection smoke test
        run: |
          cat > /tmp/star-kb-fixture.json <<'JSON'
          {
            "_id": "starintel:relation:ci",
            "dataset": "ci",
            "dtype": "relation",
            "schema_version": "0.9.0",
            "profile": "starintel-core",
            "profile_version": "0.9.1",
            "schema_revision": "0.9.0+fields.20260909.1",
            "version": 1,
            "sources": [
              {
                "source_id": "src-ci",
                "kind": "test",
                "url": "https://example.test/ci",
                "credibility": 1.0,
                "reliability": 1.0
              }
            ],
            "evidence": [
              {
                "evidence_id": "ev-ci",
                "source_id": "src-ci",
                "role": "supporting",
                "claim": "CI relation fixture.",
                "confidence": 1.0,
                "status": "verified"
              }
            ],
            "data": {
              "subject": "starintel:person:a",
              "predicate": "works_for",
              "object": "starintel:org:b",
              "directed": true,
              "confidence": 1.0
            }
          }
          JSON
          tools/prolog-star-kb project /tmp/star-kb-fixture.json -o /tmp/star-kb-fixture.pl
          swipl -q \
            -g "use_module('kb/core/star_json.pl'), use_module('kb/core/star_reasoning.pl'), star_json:load_projection('/tmp/star-kb-fixture.pl'), star_reasoning:tool_explain_relation('starintel:relation:ci', Explanation), nonvar(Explanation), halt(0)" \
            -t "halt(1)"
      - name: Synchronize structure
        run: python3 scripts/sync.py
      - name: Check synchronization
        run: python3 scripts/sync.py --check
      - name: Validate research control plane
        run: python3 scripts/validate-docs.py

  starlang-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Validate canonical StarLang learning protocol
        env:
          STARLANG_REF: github:lost-rob0t/star-lang/c9d56a38e04ef5cc1cfe90924da1551c7125bf3e
        run: |
          set -euo pipefail

          # The final compiler owns actor-unit validation today.
          for actor in spec/actors/*.star; do
            nix run "$STARLANG_REF" -- check "$PWD/$actor"
          done

          # Pin the exact library source bytes used by Star KB runtime events.
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from prolog_star_kb.actors import SPEC_DIGEST, SPEC_PATH

          actual = "sha256:" + hashlib.sha256(Path(SPEC_PATH).read_bytes()).hexdigest()
          if SPEC_DIGEST != actual:
              raise SystemExit(f"StarLang spec digest drift: runtime={SPEC_DIGEST} source={actual}")
          print(f"ok: canonical StarLang library source {SPEC_DIGEST}")
          PY

          # Full spec-library compilation is still prototype-owned in this
          # pinned StarLang revision. Try it, fail on real StarLang errors,
          # but tolerate only the known transitional sha256sum bug (#144).
          set +e
          library_output="$(
            nix run "$STARLANG_REF" -- load "$PWD/spec/star-kb-learning.star" 2>&1
          )"
          library_status=$?
          set -e

          if [ "$library_status" -eq 0 ]; then
            printf '%s\n' "$library_output"
            echo "ok: full StarLang spec-library load"
          elif printf '%s\n' "$library_output" | grep -Fq             "SHA-256 calculation failed through sha256sum"; then
            printf '%s\n' "$library_output"
            echo "::warning::Full spec-library load is blocked by lost-rob0t/star-lang#144; final spec-library manifests/codegen are tracked by #143."
          else
            printf '%s\n' "$library_output" >&2
            exit "$library_status"
          fi
